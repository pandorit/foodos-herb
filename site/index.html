  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --teal: #4A9D9A;
      --teal-dark: #2C6360;
      --teal-light: #EBF6F6;
      --text: #1A1A1A;
      --serif: 'Playfair Display', Georgia, serif;
      --sans: 'Inter', system-ui, sans-serif;
    }
    body {
      font-family: var(--sans);
      color: var(--text);
      background: var(--teal-light);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      direction: rtl;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 3rem 2.5rem;
      text-align: center;
      max-width: 420px;
      width: 90%;
      box-shadow: 0 12px 40px rgba(44,99,96,.12);
    }
    .logo {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 2rem;
      text-decoration: none;
    }
    .logo-circle {
      width: 52px; height: 52px;
      background: var(--teal);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: 1.4rem; font-weight: 700;
      box-shadow: 0 2px 10px rgba(74,157,154,.35);
      flex-shrink: 0;
    }
    .logo-name {
      font-family: var(--serif);
      font-size: 1.2rem; font-weight: 700;
      color: var(--text); line-height: 1.1; text-align: right;
    }
    .logo-name small {
      display: block; font-family: var(--sans);
      font-size: 0.65rem; font-weight: 600;
      color: var(--teal); letter-spacing: 1.5px; text-transform: uppercase;
    }
    h1 {
      font-family: var(--serif);
      font-size: 1.5rem; font-weight: 700;
      color: var(--teal-dark);
      margin-bottom: 0.75rem;
      line-height: 1.3;
    }
    p {
      font-size: 0.95rem; color: #6B7280;
      margin-bottom: 1.75rem; line-height: 1.6;
    }
    .btn {
      display: inline-block;
      background: var(--teal);
      color: white;
      font-family: var(--sans);
      font-size: 0.95rem; font-weight: 600;
      padding: 12px 28px;
      border-radius: 100px;
      text-decoration: none;
      transition: background .18s;
    }
    .btn:hover { background: var(--teal-dark); }
    .redirect-note {
      margin-top: 1.25rem;
      font-size: 0.8rem; color: #9CA3AF;
    }
  </style>

  <div class="card">

    <p>291 מוצרים מאומתים כשר, עם הסברים בעברית ולינקים ישירים לרכישה.</p>
