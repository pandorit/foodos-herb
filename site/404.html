<html lang="he" dir="rtl">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>דף לא נמצא — FOODOS herb</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --teal: #4A9D9A;
      --teal-dark: #2C6360;
      --teal-light: #EBF6F6;
      --text: #1A1A1A;
      --serif: 'Playfair Display', Georgia, serif;
      --sans: 'Inter', system-ui, sans-serif;
    }
    body {
      font-family: var(--sans);
      color: var(--text);
      background: var(--teal-light);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      direction: rtl;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 3.5rem 2.5rem;
      text-align: center;
      max-width: 460px;
      width: 90%;
      box-shadow: 0 12px 40px rgba(44,99,96,.12);
    }
    .logo {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 2rem;
      text-decoration: none;
    }
    .logo-circle {
      width: 52px; height: 52px;
      background: var(--teal);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: 1.4rem; font-weight: 700;
      box-shadow: 0 2px 10px rgba(74,157,154,.35);
      flex-shrink: 0;
    }
    .logo-name {
      font-family: var(--serif);
      font-size: 1.2rem; font-weight: 700;
      color: var(--text); line-height: 1.1; text-align: right;
    }
    .logo-name small {
      display: block; font-family: var(--sans);
      font-size: 0.65rem; font-weight: 600;
      color: var(--teal); letter-spacing: 1.5px; text-transform: uppercase;
    }
    .error-code {
      font-family: var(--serif);
      font-size: 5rem; font-weight: 700;
      color: var(--teal);
      line-height: 1;
      margin-bottom: 0.5rem;
      opacity: 0.25;
    }
    h1 {
      font-family: var(--serif);
      font-size: 1.6rem; font-weight: 700;
      color: var(--teal-dark);
      margin-bottom: 0.75rem;
      line-height: 1.3;
    }
    p {
      font-size: 0.95rem; color: #6B7280;
      margin-bottom: 2rem; line-height: 1.6;
    }
    .btn-group {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-block;
      font-family: var(--sans);
      font-size: 0.9rem; font-weight: 600;
      padding: 11px 24px;
      border-radius: 100px;
      text-decoration: none;
      transition: all .18s;
    }
    .btn-primary {
      background: var(--teal);
      color: white;
    }
    .btn-primary:hover { background: var(--teal-dark); }
    .btn-secondary {
      background: var(--teal-light);
      color: var(--teal-dark);
      border: 1px solid rgba(74,157,154,.3);
    }
    .btn-secondary:hover { background: #d8eeee; }
    .divider {
      margin: 2rem auto;
      width: 40px; height: 2px;
      background: var(--teal-light);
      border-radius: 2px;
    }
    .suggestion {
      font-size: 0.85rem; color: #9CA3AF;
    }
    .suggestion a {
      color: var(--teal);
      text-decoration: none;
      font-weight: 600;
    }
    .suggestion a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <a href="/kosher-iherb/" class="logo">
      <div class="logo-circle">פ</div>
      <div class="logo-name">
        FOODOS
        <small>herb ✦ כשר</small>
      </div>
    </a>

    <div class="error-code">404</div>
    <h1>הדף הזה לא קיים</h1>
    <p>ייתכן שהקישור שגוי, או שהדף הועבר למקום אחר.<br>אבל יש לנו 291 מוצרים כשרים שמחכים לך.</p>

    <div class="btn-group">
      <a href="/kosher-iherb/" class="btn btn-primary">חזרה לדף הבית ←</a>
      <a href="/kosher-iherb/product.html" class="btn btn-secondary">לרשימת המוצרים</a>
    </div>

    <div class="divider"></div>
    <p class="suggestion">
      חיפוש ישיר ב-iHerb?
      <a href="https://il.iherb.com" target="_blank" rel="noopener">לחצי כאן ←</a>
    </p>
  </div>
</body>
</html>
