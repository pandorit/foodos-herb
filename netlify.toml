[build]
  publish = "site"

# Security headers for all pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options            = "DENY"
    X-Content-Type-Options     = "nosniff"
    Referrer-Policy            = "strict-origin-when-cross-origin"
    Permissions-Policy         = "camera=(), microphone=(), geolocation=()"

# Long cache for font (immutable once deployed)
[[headers]]
  for = "/Varela_Round/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Short cache for data files so updates appear quickly
[[headers]]
  for = "/data/*.json"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=60"

# /kosher-iherb/ → homepage
[[redirects]]
  from   = "/kosher-iherb/"
  to     = "/foodos-herb-homepage.html"
  status = 302

# 404 fallback
[[redirects]]
  from   = "/*"
  to     = "/404.html"
  status = 404
